[project]
name = "tts-estimate"
version = "0.1.0"
description = "TTS Quality Estimation Tool"
dependencies = [
    "openai-whisper",
    "jiwer",
    "numpy",
    "onnxruntime",
    "pydantic",
    "pydantic-settings",
    "speechbrain",
    "librosa",
]
requires-python = ">=3.12"
# torch/torchaudio are deliberately absent: install the host-specific
# ROCm/CUDA build first, see the repository root pyproject.toml and
# scripts/install.sh, then use the [tts] extra there.

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
