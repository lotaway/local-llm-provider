[project]
authors = [{ name = "lotaway", email = "lotaway@foxmail.com" }]
name = "local-llm-provider"
version = "0.1.0"
description = "Local LLM Provider with RAG and Agent"
readme = "README.md"
requires-python = ">=3.12.3"
dependencies = [
  "fastapi>=0.118.0",
  "pydantic>=2.11.9",
  "uvicorn>=0.37.0",
  "transformers>=4.57.0",
  "accelerate>=1.10.1",
  "openai>=2.2.0",
  "httpx>=0.28.1",
  "python-dotenv>=1.1.1",
  "psutil>=5.9.0",
  "PyYAML>=6.0.3",
  # RAG dependencies
  "langchain>=1.0.8",
  "langchain-community>=0.4.1",
  "langchain-text-splitters>=1.0.0",
  "langchain-core>=1.0.4",
  "langchain-huggingface>=1.0.1",
  "pymilvus>=2.6.3",
  "sentence-transformers>=5.1.2",
  "unstructured>=0.18.20",
  "markdown",
  "langchain_milvus>=0.3.0",
  # Agent dependencies
  "rank-bm25==0.2.2",
  "langchain-milvus>=0.3.0",
  "pymongo>=4.8.0",
  "redis>=5.0.0",
  "psycopg2-binary>=2.9.0",
  "python-multipart>=0.0.20",
  "elasticsearch>=9.0.0",
  "neo4j>=6.1.0",
  "bitsandbytes>=0.43.0",
  "slowapi>=0.1.9",
  "Pillow>=10.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# Note: torch installation reference
# torch install: https://rocm.docs.amd.com/projects/radeon-ryzen/en/latest/docs/install/installrad/wsl/install-pytorch.html#verify-pytorch-installation

# Note: Manual installation required for Janus
# Install [janus](https://github.com/deepseek-ai/Janus.git) manually.

[tool.setuptools]
packages = [
  "agents",
  "routers",
  "retrievers",
  "controllers",
  "schemas",
  "globals",
  "file_loaders",
  "model_providers",
  "utils",
  "adapters",
  "clients",
]

[project.scripts]
local-llm-provider = "main:main"
llp-cli = "clients.cli:main"
acp-agent = "adapters.stdio_adapter:main"

# Optional dependencies
[project.optional-dependencies]
vllm = [
    "vllm>=0.6.0",
]
# StyleTTS2 voice engine (see scripts/setup_styletts2.sh).
# torch/torchaudio are deliberately NOT declared here: they must come from the
# host-specific ROCm/CUDA/CPU wheel, otherwise pip can replace the accelerator
# build with the default PyPI package. Install them before this extra.
tts = [
    "einops>=0.6",
    "einops-exts>=0.0.4",
    "munch>=4.0",
    "tqdm>=4.60",
    "typing-extensions>=4.5",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pydub>=0.25.1",
    "nltk>=3.8",
    "matplotlib>=3.7",
    "phonemizer>=3.2",
    "espeakng-loader>=0.2.4",
    "audioop-lts>=0.2; python_version >= '3.13'",
    "vector-quantize-pytorch>=1.14",
    "monotonic-align @ git+https://github.com/resemble-ai/monotonic_align.git",
]
# 使用方式: pip install -e .[vllm] / pip install -e .[tts]
# 注意: [tts] 不包含 torch/torchaudio，需先按宿主安装对应的 ROCm/CUDA/CPU 构建。
