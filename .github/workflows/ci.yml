name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    name: Quality gate (baseline-tolerant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run quality gate
        run: python scripts/quality_gate.py
      - name: Guard baseline edits
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          LLP_BASELINE_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'baseline-approved') && '1' || '0' }}
        run: python scripts/baseline_policy.py

  targeted-tests:
    name: Targeted tests + TODO consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CPU torch first (do not replace host ROCm/CUDA builds)
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Pin the installed torch build
        run: python scripts/check_torch_build.py --constraints torch-constraints.txt
      - name: Install project
        run: pip install --upgrade-strategy only-if-needed -c torch-constraints.txt -e ".[tts]" pytest pytest-asyncio
      - name: Verify checked TODO references
        run: python scripts/todo_guard.py --check --allow-empty
      - name: Run targeted regression suite (all other tests are tracked in scripts/test_skip_allowlist.json)
        run: |
          python -m pytest -q --junitxml=todo_junit.xml \
            tests/test_tts_quality_gateway.py \
            tests/test_tts_audio_quality.py \
            tests/test_tts_post_processing.py \
            tests/test_tts_alerts.py \
            tests/test_tts_request_sampler.py \
            tests/test_tts_regression_suite.py \
            tests/test_tts_quality_statistics.py \
            tests/test_tts_feedback_monitor.py \
            tests/test_style_tts2_engine.py \
            tests/test_style_tts2_streaming.py \
            tests/test_styletts2_setup.py \
            tests/test_mcp_env_loading.py \
            tests/test_mcp_protocol.py \
            tests/test_mcp_error_handling.py \
            tests/test_mcp_failure_injection.py \
            tests/test_molt_integration.py \
            tests/test_molt_scheduler.py \
            tests/test_skills_env_loading.py \
            tests/test_version_manager.py \
            tests/test_agent_protocol.py \
            tests/test_agent_protocol_integration.py \
            tests/test_dnsmos_inference.py \
            tests/test_todo_guard.py \
            tests/test_molt_startup.py \
            tests/test_tts_jitter.py \
            tests/test_tts_estimate_summary.py \
            tests/test_tts_post_processor_wiring.py \
            tests/test_constants_comments.py \
            tests/test_exception_handling_contract.py \
            tests/test_document_record.py \
            tests/test_tts_post_processing_boundary.py \
            tests/test_tts_preference_store_boundary.py \
            tests/test_tts_naming.py \
            tests/test_mcp_registry_lifecycle.py \
            tests/test_skip_allowlist.py \
            tests/test_baseline_policy.py \
            tests/test_todo_guard_policy.py \
            tests/test_tts_alert_wiring.py
      - name: Assert checked TODO tests are green
        if: always()
        run: python scripts/todo_guard.py --report todo_junit.xml

  skip-policy:
    name: Test skip allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify every test is targeted or explicitly allowlisted
        run: python scripts/check_skip_allowlist.py
